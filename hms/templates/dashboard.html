<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shradha HMS Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .cards { display: flex; gap: 16px; margin-bottom: 24px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; width: 220px; }
    a.btn { display: inline-block; padding: 10px 14px; background:#0b79d0; color:#fff; text-decoration:none; border-radius:6px; }
  </style>
</head>
<body>
  <h2>Shradha HMS Dashboard</h2>
  <div class="cards">
    <div class="card"><b>Patients:</b> {{ patient_count }}</div>
    <div class="card"><b>Doctors:</b> {{ doctor_count }}</div>
    <div class="card"><b>Appointments:</b> {{ appt_count }}</div>
  </div>
  <p>
    <a class="btn" href="/admin/">Admin</a>
    <a class="btn" href="/patients/new/">New Patient</a>
    <a class="btn" href="/appointments/new/">New Appointment</a>
  </p>
</body>
</html>
