<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Report &ndash; {{ item.investigation.name }} &ndash; {{ item.bill.patient.full_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #d9d9d9;
      color: #000;
      font-family: 'Courier New', Consolas, 'DejaVu Sans Mono', monospace;
    }

    /* ── Print toolbar (screen only) ── */
    .toolbar {
      background: #1a3a5c;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .toolbar a { color: #fff; text-decoration: none; font-size: 14px; opacity: .85; }
    .toolbar a:hover { opacity: 1; }
    .btn-print {
      background: #fff;
      color: #1a3a5c;
      border: none;
      padding: 8px 22px;
      border-radius: 4px;
      font: bold 14px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .btn-print:hover { background: #ddeeff; }

    /* ── Report sheet ── */
    .sheet {
      background: #fff;
      max-width: 860px;
      margin: 24px auto 40px;
      padding: 28px 32px;
      border: 1px solid #bbb;
      box-shadow: 0 2px 16px rgba(0,0,0,.15);
      overflow-x: auto;                 /* long lines scroll on screen, don't wrap */
    }
    .report-body {
      font-family: 'Courier New', Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 12.5px;
      line-height: 1.38;
      white-space: pre;                 /* preserve every space -> column alignment */
      tab-size: 4;
      color: #000;
    }
    /* HIGH / LOW / CRIT flags: bold, still one monospace column wide */
    .report-body .flag { font-weight: 700; }
    .report-body .flag-high { color: #b3261e; }
    .report-body .flag-low  { color: #1a4f8b; }
    .report-body .flag-crit { color: #b3261e; }

    /* ── Print ── */
    @media print {
      body { background: #fff; }
      .toolbar, .print-again { display: none !important; }
      .sheet {
        max-width: 100%;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
        overflow: visible;
      }
      .report-body { font-size: 10.5px; }
      .report-body .flag-high,
      .report-body .flag-low,
      .report-body .flag-crit {
        color: #000;                    /* mono print: rely on bold, not colour */
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">&#128424; Print Report</button>
  <a href="javascript:history.back()">&larr; Back</a>
</div>

<div class="sheet"><pre class="report-body">{% for ln in report_lines %}{% if ln.is_row %}{{ ln.before }}<b class="flag{% if ln.flag_css %} {{ ln.flag_css }}{% endif %}">{{ ln.flag }}</b>{{ ln.after }}
{% else %}{{ ln.text }}
{% endif %}{% endfor %}</pre></div>

<div class="print-again" style="text-align:center; margin-bottom:32px;">
  <button class="btn-print" onclick="window.print()"
    style="background:#1a3a5c;color:#fff;padding:10px 28px;border-radius:5px;">
    &#128424; Print Report
  </button>
</div>

</body>
</html>
