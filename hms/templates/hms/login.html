<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Shradha HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; border: none; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
    .login-header { background: #1a73e8; color: #fff; border-radius: 12px 12px 0 0; padding: 2rem; text-align: center; }
    .login-header h4 { margin: 0; font-weight: 600; letter-spacing: .5px; }
    .login-header p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <h4>🏥 Shradha Hospital</h4>
      <p>Hospital Management System</p>
    </div>
    <div class="card-body p-4">

      {% if form.errors %}
      <div class="alert alert-danger py-2" style="font-size:13px">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      {% if messages %}
      {% for msg in messages %}
      <div class="alert alert-info py-2" style="font-size:13px">{{ msg }}</div>
      {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" style="font-size:13px">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>
      </form>

    </div>
    <div class="card-footer text-center text-muted py-2" style="font-size:12px;border-radius:0 0 12px 12px">
      Shradha Hospital &copy; 2024
    </div>
  </div>
</body>
</html>
