<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OPD Receipt</title>
{% load i18n %}

<style>
    @page {
        size: A4;
        margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: #000;
        background: white;
    }

    /* Two receipt slots side by side */
    .page {
        width: 210mm;
        height: 297mm;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        padding-top: 10mm;
    }

    /* First receipt - left side */
    .receipt-left {
        width: 100mm;
        padding: 6mm 5mm 6mm 8mm;
    }

    /* Second receipt - right side, shifted 5mm right for easy punching */
    .receipt-right {
        width: 100mm;
        padding: 6mm 5mm 6mm 13mm; /* 8mm + 5mm shift */
        border-left: 1px dashed #aaa;
        margin-left: 2mm;
    }

    .receipt-box {
        width: 100%;
    }

    .center {
        text-align: center;
        margin-bottom: 6px;
        border-bottom: 2px solid #000;
        padding-bottom: 6px;
    }

    .center h3 {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 3px;
    }

    .center div {
        font-size: 9.5px;
        color: #333;
        line-height: 1.5;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
    }

    td {
        border: 1px solid #999;
        padding: 4px 5px;
        vertical-align: top;
        font-size: 10.5px;
    }

    .label {
        width: 38%;
        font-weight: 700;
        background: #f5f5f5;
    }

    .value {
        width: 62%;
    }

    .printed-on {
        margin-top: 6px;
        font-size: 9.5px;
        color: #333;
    }

    /* Cut line between receipts */
    .cut-line {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 8px;
        color: #bbb;
        letter-spacing: 3px;
        margin-top: 20mm;
        padding: 0 2px;
    }
</style>
</head>

<body>
<div class="page">

    <!-- LEFT RECEIPT (Patient copy) -->
    <div class="receipt-left">
        {% include "opd/_opd_receipt_copy.html" %}
    </div>

    <!-- Dashed cut line label -->
    <div class="cut-line">✂ &nbsp; CUT HERE</div>

    <!-- RIGHT RECEIPT (Hospital copy) - shifted 5mm right -->
    <div class="receipt-right">
        {% include "opd/_opd_receipt_copy.html" with copy_label="Hospital Copy" %}
    </div>

</div>
</body>
</html>
