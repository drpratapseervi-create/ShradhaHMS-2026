{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Add Supplier</h2>
    <a href="{% url 'hms:supplier_list' %}" class="btn btn-secondary">← Back</a>
  </div>
  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Supplier Name</label>
          <input type="text" name="name" class="form-control" required placeholder="Company or person name">
        </div>
        <div class="col-md-3">
          <label class="form-label">Contact Number</label>
          <input type="text" name="contact" class="form-control" placeholder="Mobile number">
        </div>
        <div class="col-md-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="email@example.com">
        </div>
        <div class="col-md-12">
          <label class="form-label">Address</label>
          <textarea name="address" class="form-control" rows="2" placeholder="Full address"></textarea>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary px-4">Save Supplier</button>
        <a href="{% url 'hms:supplier_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
