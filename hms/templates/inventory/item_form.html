{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Add New Inventory Item</h2>
    <a href="{% url 'hms:inventory_items' %}" class="btn btn-secondary">← Back</a>
  </div>
  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Item Name</label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. Paracetamol 500mg">
        </div>
        <div class="col-md-3">
          <label class="form-label">Category</label>
          <select name="category" class="form-select" required>
            <option value="Medicine">Medicine</option>
            <option value="Surgical">Surgical Supply</option>
            <option value="Equipment">Equipment</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Unit</label>
          <select name="unit" class="form-select" required>
            <option value="Tablet">Tablet</option>
            <option value="Capsule">Capsule</option>
            <option value="Vial">Vial</option>
            <option value="Ampoule">Ampoule</option>
            <option value="Bottle">Bottle</option>
            <option value="Strip">Strip</option>
            <option value="Piece">Piece</option>
            <option value="Box">Box</option>
            <option value="Kg">Kg</option>
            <option value="Litre">Litre</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Opening Stock</label>
          <input type="number" name="current_stock" class="form-control" value="0" min="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Minimum Stock (Alert Level)</label>
          <input type="number" name="minimum_stock" class="form-control" value="10" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Supplier (Optional)</label>
          <select name="supplier" class="form-select">
            <option value="">-- None --</option>
            {% for s in suppliers %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary px-4">Save Item</button>
        <a href="{% url 'hms:inventory_items' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
