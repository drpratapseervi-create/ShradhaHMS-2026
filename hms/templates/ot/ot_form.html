{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>New OT Booking</h2>
    <a href="{% url 'hms:ot_dashboard' %}" class="btn btn-secondary">← Back</a>
  </div>

  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">

        <!-- UHID Search -->
        <div class="col-md-4 position-relative">
          <label class="form-label">UHID / Patient Search</label>
          <input type="text" id="uhid_search" class="form-control"
                 placeholder="Type UHID or patient name..." autocomplete="off">
          <input type="hidden" name="uhid" id="uhid_hidden">
          <input type="hidden" name="patient" id="patient_hidden">
          <div id="uhid_suggestions" class="list-group position-absolute z-3"
               style="width:100%; top:100%; left:0;"></div>
        </div>

        <!-- Patient Name — auto filled -->
        <div class="col-md-8">
          <label class="form-label">Patient Name</label>
          <input type="text" id="patient_name_display" class="form-control bg-light fw-bold"
                 placeholder="Auto-filled after UHID selection" readonly>
        </div>

        <!-- Surgeon -->
        <div class="col-md-4">
          <label class="form-label">Surgeon</label>
          <select name="surgeon" class="form-select" required>
            <option value="">-- Select Surgeon --</option>
            {% for doc in doctors %}
            <option value="{{ doc.full_name }}">{{ doc.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Assistant -->
        <div class="col-md-4">
          <label class="form-label">Assistant</label>
          <select name="assistant" class="form-select">
            <option value="">-- None --</option>
            {% for doc in doctors %}
            <option value="{{ doc.full_name }}">{{ doc.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Anesthetist -->
        <div class="col-md-4">
          <label class="form-label">Anesthetist</label>
          <select name="anesthetist" class="form-select" required>
            <option value="">-- Select Anesthetist --</option>
            {% for doc in doctors %}
            <option value="{{ doc.full_name }}">{{ doc.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Procedure -->
        <div class="col-md-4">
          <label class="form-label">Procedure</label>
          <input type="text" name="procedure" class="form-control"
                 required placeholder="Enter procedure name">
        </div>

        <!-- OT Room -->
        <div class="col-md-4">
          <label class="form-label">OT Room</label>
          <input type="text" name="ot_room" class="form-control" placeholder="e.g. OT-1">
        </div>

        <!-- Date -->
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input type="date" name="ot_date" class="form-control" required>
        </div>

        <!-- Time -->
        <div class="col-md-4">
          <label class="form-label">Time</label>
          <input type="time" name="ot_time" class="form-control" required>
        </div>

        <!-- Case Type -->
        <div class="col-md-4">
          <label class="form-label">Case Type</label>
          <select name="case_type" class="form-select" required>
            <option value="Elective">Elective</option>
            <option value="Emergency">Emergency</option>
          </select>
        </div>

        <!-- Anesthesia Type -->
        <div class="col-md-4">
          <label class="form-label">Anesthesia Type</label>
          <select name="anesthesia_type" class="form-select" required>
            <option value="GA">General Anaesthesia (GA)</option>
            <option value="SA">Spinal Anaesthesia (SA)</option>
            <option value="LA">Local Anaesthesia (LA)</option>
          </select>
        </div>

      </div><!-- end row -->

      <div class="mt-4">
        <button type="submit" class="btn btn-primary px-4">Save Booking</button>
        <a href="{% url 'hms:ot_dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
      </div>

    </form>
  </div>
</div>

<!-- UHID Live Search Script -->
<script>
document.getElementById("uhid_search").addEventListener("input", function () {
  const query = this.value.trim();
  const box = document.getElementById("uhid_suggestions");

  if (query.length < 2) {
    box.innerHTML = "";
    document.getElementById("patient_name_display").value = "";
    document.getElementById("uhid_hidden").value = "";
    document.getElementById("patient_hidden").value = "";
    return;
  }

  fetch(`/api/patient-search/?q=${encodeURIComponent(query)}`)
    .then(r => r.json())
    .then(data => {
      box.innerHTML = "";

      if (data.length === 0) {
        box.innerHTML = '<div class="list-group-item text-muted">No patients found</div>';
        document.getElementById("patient_name_display").value = "";
        return;
      }

      // ✅ If UHID matches exactly — auto-fill without needing to click
      const exactMatch = data.find(p => p.uhid.toUpperCase() === query.toUpperCase());
      if (exactMatch) {
        document.getElementById("uhid_hidden").value          = exactMatch.uhid;
        document.getElementById("patient_hidden").value       = exactMatch.id;
        document.getElementById("patient_name_display").value = exactMatch.name;
        box.innerHTML = "";
        return;
      }

      // Otherwise show dropdown suggestions
      data.forEach(p => {
        const item = document.createElement("a");
        item.href = "#";
        item.className = "list-group-item list-group-item-action";
        item.textContent = `${p.uhid} — ${p.name}`;
        item.addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("uhid_search").value          = p.uhid;
          document.getElementById("uhid_hidden").value          = p.uhid;
          document.getElementById("patient_hidden").value       = p.id;
          document.getElementById("patient_name_display").value = p.name;
          box.innerHTML = "";
        });
        box.appendChild(item);
      });
    })
    .catch(() => {
      box.innerHTML = '<div class="list-group-item text-danger">Search error. Try again.</div>';
    });
});

// Close suggestions when clicking outside
document.addEventListener("click", function (e) {
  if (!e.target.closest("#uhid_search")) {
    document.getElementById("uhid_suggestions").innerHTML = "";
  }
});
</script>

{% endblock %}
